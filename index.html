<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic 3D - Alergare pe teren curbat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial Black', Arial, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            font-size: 22px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
        }
        #hud-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 22px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        #hud-left .label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        #hud-left .value {
            font-size: 28px;
            font-weight: bold;
        }
        .coin-value {
            color: #ffd700;
        }
        .emerald-value {
            color: #50ff80;
        }
        .score-value {
            color: #ff6b6b;
        }

        #hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 22px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            font-size: 14px;
            opacity: 0.8;
        }
        #hud-right .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 0 10px;
            border-radius: 6px;
            font-weight: bold;
            color: #fff;
            font-size: 13px;
            min-width: 28px;
            text-align: center;
        }

        #message {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 14px 32px;
            border-radius: 40px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        #message.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            #hud {
                padding: 0 12px;
                font-size: 16px;
                top: 10px;
            }
            #hud-left {
                padding: 8px 14px;
            }
            #hud-left .value {
                font-size: 20px;
            }
            #hud-right {
                padding: 8px 14px;
                font-size: 11px;
            }
            #message {
                font-size: 14px;
                padding: 10px 20px;
                bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div id="hud-left">
            <div>
                <div class="label">🪙 Monede</div>
                <div class="value coin-value" id="coinCount">0</div>
            </div>
            <div>
                <div class="label">💎 Emeralde</div>
                <div class="value emerald-value" id="emeraldCount">0</div>
            </div>
            <div>
                <div class="label">⭐ Scor</div>
                <div class="value score-value" id="scoreDisplay">0</div>
            </div>
        </div>
        <div id="hud-right">
            <div><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> — deplasare</div>
            <div style="margin-top:4px;font-size:12px;opacity:0.6;">⬆ viteza · ⬇ frana</div>
        </div>
    </div>

    <div id="message">✨ +25 puncte!</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        //  SETUP SCENE
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a90d9);
        scene.fog = new THREE.Fog(0x4a90d9, 80, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ============================================================
        //  LIGHTING
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0x6688cc, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        sunLight.position.set(40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -80;
        sunLight.shadow.camera.right = 80;
        sunLight.shadow.camera.top = 80;
        sunLight.shadow.camera.bottom = -80;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.6);
        fillLight.position.set(-30, 20, -40);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a7d44, 0.8);
        scene.add(hemiLight);

        // ============================================================
        //  TERRAIN
        // ============================================================
        const TERRAIN_SIZE = 120;
        const SEGMENTS = 180;
        const HALF = TERRAIN_SIZE / 2;

        function getHeight(x, z) {
            // Undulating hills with a winding "path" feel
            let h = 0;
            // Large rolling hills
            h += Math.sin(x * 0.025 + 1.2) * 5.5;
            h += Math.cos(z * 0.03 + 0.7) * 4.0;
            h += Math.sin(x * 0.012 + z * 0.018) * 6.0;
            // Medium features
            h += Math.sin(x * 0.06 + z * 0.04) * 2.0;
            h += Math.cos(x * 0.05 - z * 0.07) * 2.5;
            // Small bumps
            h += Math.sin(x * 0.12 + z * 0.09) * 1.0;
            h += Math.cos(x * 0.08 - z * 0.11) * 1.2;
            // A "ridge" that snakes through the terrain
            const ridgeX = x * 0.04;
            const ridgeZ = z * 0.035;
            const ridge = Math.sin(ridgeX + ridgeZ) * 2.5 + Math.sin(ridgeX * 1.7 - ridgeZ * 0.9) * 1.5;
            h += Math.max(0, ridge - 0.5) * 1.8;
            // Some steep drops
            const dropX = Math.sin(x * 0.07 + z * 0.05);
            const dropZ = Math.cos(x * 0.05 - z * 0.08);
            h += (dropX * dropZ) * 1.2;
            // Plateau areas
            const plat = Math.sin(x * 0.015 + z * 0.022) * 3.0 + Math.cos(x * 0.02 - z * 0.018) * 2.5;
            h += Math.max(0, plat - 1.0) * 0.6;

            // Clamp to keep playable
            return Math.max(-4, Math.min(14, h));
        }

        // Build terrain geometry
        const geo = new THREE.BufferGeometry();
        const vertices = [];
        const colors = [];
        const uvs = [];
        const indices = [];
        const normals = [];

        const step = TERRAIN_SIZE / SEGMENTS;
        const halfSize = TERRAIN_SIZE / 2;

        // Pre-compute heights for normal calculation
        const heightMap = [];
        for (let i = 0; i <= SEGMENTS; i++) {
            heightMap[i] = [];
            for (let j = 0; j <= SEGMENTS; j++) {
                const x = -halfSize + i * step;
                const z = -halfSize + j * step;
                heightMap[i][j] = getHeight(x, z);
            }
        }

        function getHeightAt(i, j) {
            if (i < 0 || i > SEGMENTS || j < 0 || j > SEGMENTS) return 0;
            return heightMap[i][j];
        }

        for (let i = 0; i <= SEGMENTS; i++) {
            for (let j = 0; j <= SEGMENTS; j++) {
                const x = -halfSize + i * step;
                const z = -halfSize + j * step;
                const y = heightMap[i][j];

                vertices.push(x, y, z);
                uvs.push(i / SEGMENTS, j / SEGMENTS);

                // Color based on height
                const hNorm = (y + 4) / 18; // map -4..14 -> 0..1
                let r, g, b;

                if (y < -1) {
                    // Low areas - darker green / teal
                    const t = (y + 4) / 3;
                    r = 0.15 + t * 0.25;
                    g = 0.35 + t * 0.35;
                    b = 0.15 + t * 0.15;
                } else if (y < 2.5) {
                    // Grass areas - bright green
                    const t = (y + 1) / 3.5;
                    r = 0.15 + t * 0.25;
                    g = 0.50 + t * 0.35;
                    b = 0.10 + t * 0.10;
                } else if (y < 6) {
                    // Mid hills - yellow-green
                    const t = (y - 2.5) / 3.5;
                    r = 0.40 + t * 0.30;
                    g = 0.65 + t * 0.10;
                    b = 0.20 - t * 0.10;
                } else if (y < 10) {
                    // Higher - brownish
                    const t = (y - 6) / 4;
                    r = 0.55 + t * 0.20;
                    g = 0.50 + t * 0.05;
                    b = 0.15 + t * 0.05;
                } else {
                    // Peaks - light brown / gray
                    const t = Math.min(1, (y - 10) / 4);
                    r = 0.70 + t * 0.15;
                    g = 0.55 + t * 0.10;
                    b = 0.20 + t * 0.20;
                }

                // Add some variation
                const variation = (Math.sin(x * 0.3 + z * 0.4) * 0.08 + 0.92);
                r *= variation;
                g *= variation;
                b *= variation;

                colors.push(r, g, b);
            }
        }

        // Indices
        for (let i = 0; i < SEGMENTS; i++) {
            for (let j = 0; j < SEGMENTS; j++) {
                const a = i * (SEGMENTS + 1) + j;
                const b = i * (SEGMENTS + 1) + j + 1;
                const c = (i + 1) * (SEGMENTS + 1) + j;
                const d = (i + 1) * (SEGMENTS + 1) + j + 1;

                indices.push(a, b, c);
                indices.push(b, d, c);
            }
        }

        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);

        // Compute normals
        geo.computeVertexNormals();

        const terrainMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.7,
            metalness: 0.05,
            flatShading: false,
            side: THREE.DoubleSide,
        });

        const terrain = new THREE.Mesh(geo, terrainMat);
        terrain.receiveShadow = true;
        terrain.castShadow = true;
        scene.add(terrain);

        // ============================================================
        //  DECORATIONS - Trees
        // ============================================================
        function addTree(x, z) {
            const y = getHeight(x, z);
            if (y < -1 || y > 9) return;

            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B6B4D, roughness: 0.9 });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d7d3a, roughness: 0.8 });

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 1.8, 6), trunkMat);
            trunk.position.set(x, y + 0.9, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 1.8, 7), leafMat);
            leaf1.position.set(x, y + 2.2, z);
            leaf1.castShadow = true;
            scene.add(leaf1);

            const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.4, 7), leafMat);
            leaf2.position.set(x, y + 3.4, z);
            leaf2.castShadow = true;
            scene.add(leaf2);
        }

        // Place trees in clusters
        for (let i = 0; i < 120; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 15 + Math.random() * 50;
            const x = Math.cos(angle) * dist + (Math.random() - 0.5) * 10;
            const z = Math.sin(angle) * dist + (Math.random() - 0.5) * 10;
            if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;
            addTree(x, z);
        }

        // Some trees near the starting area
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 8 + Math.random() * 12;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            addTree(x, z);
        }

        // ============================================================
        //  PLAYER (Sonic-style)
        // ============================================================
        const playerGroup = new THREE.Group();

        // Body - blue sphere (Sonic's body)
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x1a6bff,
            roughness: 0.3,
            metalness: 0.1,
            emissive: 0x0a3b8a,
            emissiveIntensity: 0.15,
        });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), bodyMat);
        body.scale.set(1, 0.9, 0.85);
        body.position.y = 0;
        body.castShadow = true;
        playerGroup.add(body);

        // Head
        const headMat = new THREE.MeshStandardMaterial({
            color: 0x1a6bff,
            roughness: 0.3,
            metalness: 0.1,
        });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 14), headMat);
        head.position.set(0, 0.7, 0.05);
        head.scale.set(0.9, 0.85, 0.9);
        head.castShadow = true;
        playerGroup.add(head);

        // Muzzle (tan/peach)
        const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xf5d6b0, roughness: 0.5 });
        const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), muzzleMat);
        muzzle.position.set(0, 0.55, 0.45);
        muzzle.scale.set(0.7, 0.6, 0.5);
        playerGroup.add(muzzle);

        // Nose (black)
        const noseMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 });
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), noseMat);
        nose.position.set(0, 0.55, 0.65);
        playerGroup.add(nose);

        // Eyes (white with black pupils)
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        for (let side = -1; side <= 1; side += 2) {
            const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), whiteMat);
            eyeWhite.position.set(side * 0.2, 0.7, 0.45);
            eyeWhite.scale.set(1, 0.9, 0.5);
            playerGroup.add(eyeWhite);

            const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), pupilMat);
            pupil.position.set(side * 0.24, 0.69, 0.58);
            pupil.scale.set(1, 1, 0.5);
            playerGroup.add(pupil);
        }

        // Spines (Sonic's signature spikes)
        const spineMat = new THREE.MeshStandardMaterial({
            color: 0x1a6bff,
            roughness: 0.3,
            metalness: 0.1,
            emissive: 0x0a3b8a,
            emissiveIntensity: 0.1,
        });
        for (let i = -2; i <= 2; i++) {
            const spine = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 6), spineMat);
            const angle = (i / 2.5) * 0.6;
            spine.position.set(Math.sin(angle) * 0.55, 0.9 + Math.abs(i) * 0.06, -0.35 + Math.abs(i) * 0.04);
            spine.rotation.x = -0.3 + Math.abs(i) * 0.1;
            spine.rotation.z = angle * 0.5;
            spine.scale.set(1 - Math.abs(i) * 0.06, 1, 1);
            spine.castShadow = true;
            playerGroup.add(spine);
        }

        // Shoes (red)
        const shoeMat = new THREE.MeshStandardMaterial({
            color: 0xee2222,
            roughness: 0.4,
            metalness: 0.05,
            emissive: 0x881111,
            emissiveIntensity: 0.1,
        });
        for (let side = -1; side <= 1; side += 2) {
            const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.2, 0.55), shoeMat);
            shoe.position.set(side * 0.35, -0.4, 0.2);
            shoe.rotation.x = 0.1;
            shoe.castShadow = true;
            playerGroup.add(shoe);

            // White stripe on shoe
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.35), stripeMat);
            stripe.position.set(side * 0.35, -0.35, 0.2);
            stripe.rotation.x = 0.1;
            playerGroup.add(stripe);
        }

        // Gloves (white)
        const gloveMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        for (let side = -1; side <= 1; side += 2) {
            const glove = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), gloveMat);
            glove.position.set(side * 0.5, 0.1, 0.35);
            glove.scale.set(1, 0.8, 0.8);
            playerGroup.add(glove);
        }

        // Position player
        const startX = 0;
        const startZ = 0;
        const startY = getHeight(startX, startZ);
        playerGroup.position.set(startX, startY + 0.5, startZ);
        scene.add(playerGroup);

        // ============================================================
        //  COLLECTIBLES
        // ============================================================
        const coins = [];
        const emeralds = [];
        const collectibles = [];

        // Coin (ring) - gold torus
        function createCoin(x, z) {
            const y = getHeight(x, z) + 0.5;
            const geom = new THREE.TorusGeometry(0.35, 0.08, 10, 18);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0xff8800,
                emissiveIntensity: 0.15,
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.x = Math.PI / 2;
            mesh.castShadow = true;
            mesh.userData = { type: 'coin', collected: false, floatOffset: Math.random() * Math.PI * 2 };
            scene.add(mesh);
            coins.push(mesh);
            collectibles.push(mesh);
            return mesh;
        }

        // Emerald - green octahedron
        function createEmerald(x, z) {
            const y = getHeight(x, z) + 0.7;
            const geom = new THREE.OctahedronGeometry(0.45, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x33dd77,
                roughness: 0.15,
                metalness: 0.3,
                emissive: 0x00aa44,
                emissiveIntensity: 0.25,
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.userData = { type: 'emerald', collected: false, floatOffset: Math.random() * Math.PI * 2 };
            scene.add(mesh);
            emeralds.push(mesh);
            collectibles.push(mesh);
            return mesh;
        }

        // Place coins in clusters and along paths
        function placeCollectibles() {
            // Coins along a winding path
            for (let i = 0; i < 80; i++) {
                const t = i / 80;
                const angle = t * Math.PI * 6 + 0.5;
                const radius = 8 + t * 25 + Math.sin(t * 8) * 4;
                const x = Math.cos(angle + Math.sin(t * 4) * 0.8) * radius;
                const z = Math.sin(angle * 0.9 + Math.cos(t * 3) * 0.5) * radius * 0.9 + Math.sin(t * 5) * 3;
                const y = getHeight(x, z);
                if (y > -2 && y < 12) {
                    createCoin(x + (Math.random() - 0.5) * 1.5, z + (Math.random() - 0.5) * 1.5);
                }
            }

            // More coins scattered
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 5 + Math.random() * 50;
                const x = Math.cos(angle) * dist + (Math.random() - 0.5) * 8;
                const z = Math.sin(angle) * dist + (Math.random() - 0.5) * 8;
                const y = getHeight(x, z);
                if (y > -1 && y < 11 && Math.abs(x) > 5 && Math.abs(z) > 5) {
                    createCoin(x, z);
                }
            }

            // Emeralds in special locations
            const emeraldPositions = [
                [8, 12],
                [-15, -8],
                [22, -18],
                [-25, 20],
                [30, 5],
                [-30, -15],
                [5, -28],
                [-8, 30],
                [40, -5],
                [-40, 10],
                [15, 35],
                [-20, -35],
                [45, 25],
                [-45, -25],
                [0, 42],
                [50, -30],
                [-50, 30]
            ];

            for (const [x, z] of emeraldPositions) {
                const y = getHeight(x, z);
                if (y > -1 && y < 13) {
                    createEmerald(x, z);
                }
            }
        }

        placeCollectibles();

        // ============================================================
        //  GAME STATE
        // ============================================================
        const state = {
            coins: 0,
            emeralds: 0,
            score: 0,
            speed: 0,
            maxSpeed: 14,
            acceleration: 0.6,
            braking: 0.3,
            friction: 0.97,
            turnSpeed: 0.045,
            rotation: 0,
            moveX: 0,
            moveZ: 0,
            grounded: true,
        };

        const keys = { w: false, a: false, s: false, d: false };

        // ============================================================
        //  UI
        // ============================================================
        const coinEl = document.getElementById('coinCount');
        const emeraldEl = document.getElementById('emeraldCount');
        const scoreEl = document.getElementById('scoreDisplay');
        const messageEl = document.getElementById('message');

        let messageTimeout = null;

        function showMessage(text, color = '#ffd700') {
            messageEl.textContent = text;
            messageEl.style.borderColor = color;
            messageEl.style.textShadow = `0 0 30px ${color}40`;
            messageEl.classList.add('show');
            if (messageTimeout) clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                messageEl.classList.remove('show');
            }, 1200);
        }

        function updateUI() {
            coinEl.textContent = state.coins;
            emeraldEl.textContent = state.emeralds;
            scoreEl.textContent = state.score;
        }

        // ============================================================
        //  CONTROLS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) {
                keys[key] = true;
                e.preventDefault();
            }
            if (key === ' ' || key === 'shift') {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // Touch controls for mobile
        let touchX = null;
        let touchY = null;

        document.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchX = t.clientX;
            touchY = t.clientY;
            // Map touch to keys
            updateTouchKeys(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            touchX = t.clientX;
            touchY = t.clientY;
            updateTouchKeys(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            touchX = null;
            touchY = null;
            keys.w = false;
            keys.s = false;
            keys.a = false;
            keys.d = false;
            e.preventDefault();
        }, { passive: false });

        function updateTouchKeys(x, y) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const dx = (x - cx) / (cx);
            const dy = (y - cy) / (cy);

            keys.w = dy < -0.2;
            keys.s = dy > 0.2;
            keys.a = dx < -0.2;
            keys.d = dx > 0.2;
        }

        // ============================================================
        //  CAMERA
        // ============================================================
        const cameraOffset = new THREE.Vector3(0, 6, 10);
        const cameraLookOffset = new THREE.Vector3(0, 1.5, 0);
        let cameraSmoothPos = new THREE.Vector3();
        let cameraSmoothLook = new THREE.Vector3();

        function updateCamera() {
            const pos = playerGroup.position;
            const targetPos = pos.clone().add(cameraOffset);
            const targetLook = pos.clone().add(cameraLookOffset);

            if (!cameraSmoothPos.length()) {
                cameraSmoothPos.copy(targetPos);
                cameraSmoothLook.copy(targetLook);
            }

            const lerpSpeed = 0.08;
            cameraSmoothPos.lerp(targetPos, lerpSpeed);
            cameraSmoothLook.lerp(targetLook, lerpSpeed);

            camera.position.copy(cameraSmoothPos);
            camera.lookAt(cameraSmoothLook);
        }

        // ============================================================
        //  COLLISION & COLLECTION
        // ============================================================
        function checkCollectibles() {
            const pos = playerGroup.position;
            const collectRadius = 1.2;

            for (const item of collectibles) {
                if (item.userData.collected) continue;
                const dist = pos.distanceTo(item.position);
                if (dist < collectRadius) {
                    item.userData.collected = true;
                    item.visible = false;

                    if (item.userData.type === 'coin') {
                        state.coins++;
                        state.score += 10;
                        showMessage('🪙 +10 puncte!', '#ffd700');
                        // Sparkle effect
                        createSparkle(item.position.clone());
                    } else if (item.userData.type === 'emerald') {
                        state.emeralds++;
                        state.score += 50;
                        showMessage('💎 +50 puncte! EMERALD!', '#50ff80');
                        // Big sparkle
                        for (let i = 0; i < 8; i++) {
                            createSparkle(item.position.clone());
                        }
                    }
                    updateUI();
                }
            }
        }

        // ============================================================
        //  SPARKLE PARTICLES
        // ============================================================
        const sparkles = [];

        function createSparkle(position) {
            const count = 15;
            const colors = [0xffd700, 0xffaa00, 0xffffff, 0x88ff88, 0x88ddff];
            for (let i = 0; i < count; i++) {
                const size = 0.06 + Math.random() * 0.12;
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: 0xff8800,
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 1,
                });
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 4, 4), mat);
                mesh.position.copy(position);
                mesh.position.x += (Math.random() - 0.5) * 0.3;
                mesh.position.y += (Math.random() - 0.5) * 0.3;
                mesh.position.z += (Math.random() - 0.5) * 0.3;
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 4 + 1,
                    (Math.random() - 0.5) * 4
                );
                mesh.userData = {
                    vel: vel,
                    life: 0.6 + Math.random() * 0.6,
                    maxLife: 1.2,
                };
                scene.add(mesh);
                sparkles.push(mesh);
            }
        }

        function updateSparkles(dt) {
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const s = sparkles[i];
                s.userData.life -= dt;
                s.position.add(s.userData.vel.clone().multiplyScalar(dt));
                s.userData.vel.y -= 3 * dt;
                const lifeRatio = s.userData.life / s.userData.maxLife;
                s.material.opacity = lifeRatio;
                s.scale.setScalar(0.3 + lifeRatio * 0.7);
                if (s.userData.life <= 0) {
                    scene.remove(s);
                    s.geometry.dispose();
                    s.material.dispose();
                    sparkles.splice(i, 1);
                }
            }
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================
        let prevTime = performance.now();

        function animate() {
            const now = performance.now();
            const dt = Math.min((now - prevTime) / 1000, 0.05);
            prevTime = now;

            // --- Player movement ---
            const forward = new THREE.Vector3(-Math.sin(state.rotation), 0, -Math.cos(state.rotation));
            const right = new THREE.Vector3(Math.cos(state.rotation), 0, -Math.sin(state.rotation));

            let moveFwd = 0;
            let moveRight = 0;

            if (keys.w) moveFwd = 1;
            if (keys.s) moveFwd = -1;
            if (keys.a) moveRight = -1;
            if (keys.d) moveRight = 1;

            // Acceleration
            if (moveFwd > 0) {
                state.speed = Math.min(state.speed + state.acceleration * dt * 8, state.maxSpeed);
            } else if (moveFwd < 0) {
                state.speed = Math.max(state.speed - state.braking * dt * 10, -state.maxSpeed * 0.4);
            } else {
                // Friction
                if (Math.abs(state.speed) > 0.1) {
                    state.speed *= (1 - state.friction * dt * 4);
                } else {
                    state.speed = 0;
                }
            }

            // Turning
            if (Math.abs(state.speed) > 0.5) {
                const turnFactor = Math.min(Math.abs(state.speed) / 8, 1);
                const turnAmount = state.turnSpeed * turnFactor * dt * 60;
                if (moveRight < 0) state.rotation += turnAmount;
                if (moveRight > 0) state.rotation -= turnAmount;
            }

            // Movement
            const moveVec = new THREE.Vector3();
            if (Math.abs(state.speed) > 0.05) {
                moveVec.copy(forward).multiplyScalar(state.speed * dt);
            }

            // Apply movement
            let newX = playerGroup.position.x + moveVec.x;
            let newZ = playerGroup.position.z + moveVec.z;

            // Clamp to terrain
            const half = TERRAIN_SIZE / 2 - 1;
            newX = Math.max(-half, Math.min(half, newX));
            newZ = Math.max(-half, Math.min(half, newZ));

            const newY = getHeight(newX, newZ);

            // Update player position
            playerGroup.position.x = newX;
            playerGroup.position.z = newZ;
            playerGroup.position.y = newY + 0.5;

            // Tilt player based on terrain slope
            const eps = 0.5;
            const hX = getHeight(newX + eps, newZ);
            const hZ = getHeight(newX, newZ + eps);
            const slopeX = (hX - getHeight(newX - eps, newZ)) / (2 * eps);
            const slopeZ = (hZ - getHeight(newX, newZ - eps)) / (2 * eps);

            const tiltX = Math.atan2(slopeZ, 1) * 0.4;
            const tiltZ = -Math.atan2(slopeX, 1) * 0.4;

            // Smooth rotation
            playerGroup.rotation.x += (tiltX - playerGroup.rotation.x) * 0.08;
            playerGroup.rotation.z += (tiltZ - playerGroup.rotation.z) * 0.08;
            playerGroup.rotation.y = state.rotation;

            // Animate collectibles
            const time = now / 1000;
            for (const item of collectibles) {
                if (item.userData.collected) continue;
                const offset = item.userData.floatOffset || 0;
                item.position.y += Math.sin(time * 2 + offset) * 0.002;
                item.rotation.x += 0.02;
                item.rotation.z += 0.01;
                // Scale pulse
                const pulse = 1 + Math.sin(time * 2.5 + offset) * 0.05;
                item.scale.setScalar(pulse);
            }

            // Coins rotate differently
            for (const coin of coins) {
                if (coin.userData.collected) continue;
                coin.rotation.y += 0.03;
            }

            // Emeralds glow
            for (const emerald of emeralds) {
                if (emerald.userData.collected) continue;
                const glow = 0.15 + Math.sin(time * 2 + emerald.userData.floatOffset) * 0.15;
                emerald.material.emissiveIntensity = glow;
            }

            // Check collection
            checkCollectibles();

            // Update sparkles
            updateSparkles(dt);

            // Camera
            updateCamera();

            // Render
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ============================================================
        //  RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        //  START
        // ============================================================
        // Init camera
        cameraSmoothPos.copy(playerGroup.position).add(cameraOffset);
        cameraSmoothLook.copy(playerGroup.position).add(cameraLookOffset);
        camera.position.copy(cameraSmoothPos);
        camera.lookAt(cameraSmoothLook);

        updateUI();
        showMessage('🟦 Alergă cu WASD! Colectează monede și emerale!', '#4a90d9');

        animate();

        console.log('🟦 Sonic 3D - Alergare pe teren curbat');
        console.log('🎮 WASD = mișcare | Colectează 🪙 și 💎');
    </script>
</body>
</html>
